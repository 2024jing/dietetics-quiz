<style>
/* Layout: a single reading column; a sticky gel strip shows each question as a band in the lane. */
:root{
  --bg:#EFF2F4;--surface:#FFFFFF;--ink:#17222E;--muted:#566472;--line:#D3DAE0;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171E;--surface:#18222B;--ink:#E7EDF2;--muted:#9DABB7;--line:#2D3A45;
  --dye:#9DABF5;--dye-soft:#252E58;--ok:#63D2A3;--ok-soft:#14352A;--no:#F49A92;--no-soft:#43201E;
  --warn:#EDC468;--warn-soft:#3A2E12;--band:#3A4955;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171E;--surface:#18222B;--ink:#E7EDF2;--muted:#9DABB7;--line:#2D3A45;
  --dye:#9DABF5;--dye-soft:#252E58;--ok:#63D2A3;--ok-soft:#14352A;--no:#F49A92;--no-soft:#43201E;
  --warn:#EDC468;--warn-soft:#3A2E12;--band:#3A4955;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.3;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 24px;max-width:62ch}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:20px}
.unit{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 4px;cursor:pointer;text-align:center;min-width:0}
.unit b{display:block;font-family:var(--mono);font-size:1rem;font-weight:500;line-height:1.3}
.unit span{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.unit[aria-pressed="true"]{background:var(--dye);border-color:var(--dye);color:var(--bg)}
.unit[aria-pressed="true"] span{color:var(--bg)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.stripTop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:var(--display);font-size:1.15rem;margin:0;min-width:0}
.score{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lane{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:16px}
.lane a{display:block;flex:0 0 13px;height:12px;border-radius:2px;background:var(--band)}
.lane a.ok{background:var(--ok)}.lane a.no{background:var(--no)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tool{font:inherit;font-size:.88rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.tool.confirm{border-color:var(--no);color:var(--no)}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:28px}
.item{scroll-margin-top:70px;min-width:0}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap}
.num{font-family:var(--mono);font-size:.85rem;color:var(--dye)}
.hf{font-size:.74rem;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 6px}
.qtext{font-weight:500;margin:0 0 10px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;display:flex;gap:10px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--dye)}
.opt:disabled{cursor:default;color:var(--muted)}
.opt i{font-family:var(--mono);font-style:normal;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--ink)}
.ans{margin-top:10px;padding:12px 14px;background:var(--surface);border-left:3px solid var(--ok)}
.ans.bad{border-left-color:var(--no)}
.verdict{font-weight:700;margin:0 0 4px}
.ans.good .verdict{color:var(--ok)}.ans.bad .verdict{color:var(--no)}
.ans p{margin:0}
.src{font-size:.78rem;color:var(--muted);margin-top:8px!important}
.note{margin-top:8px!important;font-size:.9rem;background:var(--warn-soft);color:var(--ink);padding:8px 10px;border-radius:4px}
.empty{color:var(--muted);padding:24px 0}
.next{margin-top:32px;display:flex;justify-content:flex-end}
.go{font:inherit;font-weight:500;background:var(--dye);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
:focus-visible{outline:2px solid var(--dye);outline-offset:2px}
@media (max-width:420px){.unit span{font-size:.66rem}}
.tw{overflow-x:auto;margin-bottom:10px}table{border-collapse:collapse;font-size:.9rem}th,td{border:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}th{background:var(--surface)}
.tip{margin-top:8px!important;font-size:.92rem;color:var(--dye);font-weight:500}
</style>

<div class="wrap">
  <h1>分子生物學單元一二練習</h1>
  <p class="lead">完全依照習作講義的順序與題號，單元 1 共 121 題、單元 2 共 52 題。點一個選項就會鎖定作答，並立刻顯示答案與白話解析。解析為重新撰寫，內容依分子生物學一般知識，不是講義原文。</p>
  <nav class="units" id="units" aria-label="選擇單元"></nav>

    <div class="stripTop"><h2 id="title"></h2><div class="score" id="score"></div></div>
    </div>

<script>
const DATA=[{"t": "單元1　核酸分子的結構", "qs": [{"q": "根據人類遺傳因子計畫(human genome project)的研究結果，人類的遺傳因子大約包含多少基因(genes)？", "o": ["0.5~1萬個", "1~2萬個", "3~3.5萬個", "4~5萬個", "9萬個以上"], "a": 2, "e": "這題考的是歷史數字。基因體計畫剛完成時，科學家估計人類約有 3～3.5 萬個基因，所以舊題庫的答案是 (C)。", "n": "近年的估計已下修到約 2 萬個（一般知識）。若考卷有更新，請以老師的答案為準。"}, {"q": "下列何種狀況下，基因的自由分配會發生哪裡？", "o": ["基因位在同源染色體上", "基因位在姊妹染色體上", "基因位在同一染色體上", "基因位在非同源染色體上"], "a": 3, "e": "「自由」的意思是兩對基因分配到配子時互不牽連。要做到這點，它們必須住在不同條染色體上，也就是非同源染色體。\n如果住在同一條染色體上，就像綁在一起的兩個人，會一起走，這叫連鎖。", "m": "不同條才能各走各的。"}, {"q": "根據孟德爾遺傳法則，試問下列敘述何者錯誤？", "o": ["兩個有相同表現型的個體，可有不同的基因型", "個體中每一性狀皆由兩個等位基因(alleles)控制，它們分別來自父母雙方", "人類的身高適用孟德爾遺傳法則", "分離律是指控制同一性狀之等位基因相互分離", "一顯性個體和一隱性個體交配，不會產生半顯性個體"], "a": 2, "e": "孟德爾法則適用於「一個性狀由一對基因決定」的簡單情況，例如豌豆高矮。人的身高由很多基因一起決定，營養和環境也有影響，所以 (C) 錯。\n(A) 對：AA 和 Aa 外表都一樣。(D) 對：這就是分離律的定義。"}, {"q": "孟德爾的分離律(law of segregation)與自由分配律(independent assortment)，與細胞生物學家對下列何種細胞活動時染色體的觀察相符合的現象?", "o": ["細胞質分割", "有絲分裂", "減數分裂", "染色體不分離"], "a": 2, "e": "孟德爾的兩個法則都在講配子怎麼形成。形成配子的細胞分裂就是減數分裂。\n有絲分裂是複製出一樣的體細胞，染色體不會減半，所以不是答案。", "m": "配子＝減數分裂。"}, {"q": "關於孟德爾的「分離律」，下列敘述何者錯誤？", "o": ["生物的遺傳性狀是由基因控制，且控制性狀的基因有兩種，一為顯性，一為隱性", "控制一種性狀的基因是成對存在的，形成配子時，會互相分離至配子中", "當顯性基因與隱性基因相遇時，只有顯性性狀會表現出來", "形成配子時，一對基因的分離，對另一對基因的分離沒有影響"], "a": 3, "e": "分離律只談「一對」基因：成對存在，做配子時分開。\n(D) 講的是「一對基因不影響另一對」，已經牽涉兩對基因，這是自由配合律，所以不屬於分離律。", "m": "分離律 1 對，自由配合律 2 對。"}, {"q": "下列何者為孟德爾的獨立分配律(independent assortment)？", "o": ["不同的性狀特徵各自獨立分配給下一代", "控制性狀的基因有顯性與隱性兩種型式", "每一種生物的性狀是由該種生物的遺傳因子所決定,與他種生物無關", "成對的基因可獨立分配進入配子中"], "a": 3, "e": "獨立分配的主角是「成對的基因」，不是性狀特徵本身。\n(D) 說成對基因獨立進入配子，最精準。(B) 是顯隱性的概念。(C) 與本法則無關。"}, {"q": "依據孟德爾實驗，在何種情況下，基因會遵守「獨立分配律」？", "o": ["兩對等位基因在一對染色體上，形成配子時", "精子與卵結合時", "一對等位基因形成配子時", "兩對等位基因位在不同對染色體，形成配子時"], "a": 3, "e": "獨立分配律有兩個條件：兩對基因，且在不同對染色體上；發生時機是形成配子時。(D) 兩個條件都符合。\n(A) 在同一對染色體上會連鎖。(B) 受精不是分配。(C) 只有一對，談的是分離律。"}, {"q": "下列哪一位科學家提出「天擇說」，使生物的演變得到合理的解釋？", "o": ["虎克", "達爾文", "孟德爾", "達文西"], "a": 1, "e": "看到「天擇」就想到達爾文的《物種起源》。孟德爾研究的是豌豆遺傳。"}, {"q": "有關於格里夫茲(Frederick Griffith)實驗的敘述，下列何者錯誤？", "o": ["粗糙型(R型)是不具有致病性", "光滑型(S型)是具有致病性", "性狀轉變(transformation)可改變而成為有莢膜的肺炎雙球菌", "加熱可破壞S菌株的DNA"], "a": 3, "e": "格里夫茲把 S 菌加熱殺死，再和活 R 菌一起打進老鼠，老鼠竟然死了，體內出現活的 S 菌。這表示加熱後的 S 菌還留著能傳遞性狀的物質（後來知道是 DNA）。\n所以 (D)「加熱破壞 DNA」不對。", "m": "菌死了，遺傳物質還能用。"}, {"q": "下列有關格里夫茲實驗的敘述，何者正確？", "o": ["所用的S型肺炎雙球菌因具莢膜使菌體外表光滑，所以稱為光滑型", "結果證實R型肺炎雙球菌的遺傳物質可進入用熱殺死的S型菌體內使其復活", "熱殺死的S型肺炎雙球菌之遺傳物質可進入R型肺炎球菌，使其發生轉型作用", "結果證實使S型肺炎球菌轉型成R型肺炎雙球菌的物質是DNA"], "a": 0, "e": "(A) 正確：S 就是 smooth，莢膜讓菌落看起來光滑。\n(B) 錯：不是讓死菌復活，而是活 R 菌變成 S 型。\n(C) 內容符合今天的知識，但格里夫茲當年還不知道遺傳物質是什麼。\n(D) 錯：方向反了，而且證明是 DNA 的是後來的 Avery。"}, {"q": "細菌質體(plasmid)為獨立於染色體外的環狀DNA，可用於將基因帶入菌體中(如大腸桿菌)，此質體送入菌體的過程稱為：", "o": ["transformation(轉形作用)", "amplification(放大作用)", "electroporation(電脈衝穿孔術)", "construction(構築作用)"], "a": 0, "e": "把質體這段 DNA 送進細菌，細菌性狀因此改變，這叫 transformation（轉形作用）。\n電穿孔只是用電打開小孔的「方法」，題目問的是這個「過程」的名稱。"}, {"q": "若將由已殺死有莢膜(capsule)之肺炎雙球菌提取之內含物中加入下列何種物質，則不能使無莢膜R型肺炎雙球菌變成有莢膜S型肺炎菌？", "o": ["蛋白酶(protease)", "RNA酶", "DNA酶", "加熱100℃後慢慢冷卻", "脂肪酶(lipase)"], "a": 2, "e": "實驗邏輯是：把哪種物質毀掉，轉型就失敗，那種物質就是遺傳物質。\n毀掉 DNA 後轉型失敗，所以答案是 DNA 酶。毀掉蛋白質、RNA 或脂肪，轉型仍然成功。\n加熱後慢慢冷卻，DNA 會重新配對回來，仍有作用。"}, {"q": "下列有關於R型肺炎雙球球菌在實驗鼠中所產的子代之推論，何者正確？", "o": ["外表型改變而基因型不變", "基因型改變而外表型不變", "外表型隨基因型的改變而變", "基因型隨外表型的改變而變"], "a": 2, "e": "R 菌吸收 S 菌的 DNA，等於基因真的換了，莢膜這個外表型才跟著出現。\n順序是基因型先變，外表型才變，而且會遺傳給子代。", "m": "基因決定外表，不是反過來。"}, {"q": "若取放射性同位素³²P和³⁵S，分別標記在噬菌體的核 酸及蛋白質外殼上，以此病毒感染寄主後立即做放射 性同位素測定，則下列什麼構造會呈現放射性同位素³²P和³⁵S？", "o": ["寄主細胞內有³²P，細胞外有³⁵S", "寄主細胞內有³⁵S，細胞外有³²P", "寄主細胞內有³²P和³⁵S，細胞外則無", "寄主細胞外有³²P和³⁵S，細胞內則無"], "a": 0, "e": "P 只在 DNA，S 只在蛋白質。噬菌體感染時像打針：把 DNA 注入細菌，蛋白質外殼留在外面。\n所以細胞內有 ³²P，細胞外有 ³⁵S，這也證明 DNA 才是遺傳物質。", "m": "DNA 有 P 進去，蛋白質有 S 留外面。"}, {"q": "下列敘述何者錯誤？", "o": ["生物愈高等其細胞所含的染色體數目愈多", "Watson-Crick(華生-克立克)認為DNA的複製是以半保留方式(semiconservative)進行", "Sanger發展出蛋白質與核酸定序方法，兩度獲得諾貝爾獎", "有些病毒DNA在生命週期的一段時間是單股的"], "a": 0, "e": "染色體數目和生物是否高等沒有關係，例如狗有 78 條，比人的 46 條還多，所以 (A) 錯。\n(C) Sanger 確實得過兩次諾貝爾化學獎。(D) 有些病毒如 ΦX174 是單股 DNA。"}, {"q": "根據Watson-Crick(華生-克立克)的DNA模式，有關兩股核苷酸鏈結合的力量，下列何者為非？", "o": ["鹼基間的堆積力量(stacking of the bases)", "磷酸根與鹼基間之離子交互作用(ionic interaction)", "各鹼基間所形成的氫鍵(hydrogen bonds between bases)", "鹼基間所產生的凡得瓦爾交互作用(Van der Waals interaction)"], "a": 1, "e": "兩股 DNA 靠鹼基之間的力量黏著：氫鍵、堆疊力、凡得瓦力。\n磷酸根在骨架外側，鹼基在內側，兩者不是靠離子作用結合，所以 (B) 錯。"}, {"q": "有關核苷酸(nucleotides)之敘述，下列何者正確？", "o": ["核苷酸(nucleotides)結構由1個五碳糖(pentose)、1個含氮鹼基(nitrogenous base group)及至少1個磷酸基團(phosphate group)所組成", "核苷(nucleosides)可利用磷酸二酯鍵(phosphodiester bond)形成核苷酸(nucleotides)", "核苷酸(nucleotides)在280 nm波長下有較大吸光值", "ATP、CTP、GTP及UTP等核苷酸(nucleotides)皆可作為合成DNA之原料"], "a": 0, "e": "核苷酸有三個零件：五碳糖、鹼基、磷酸，所以 (A) 對。\n(B) 磷酸二酯鍵是把核苷酸串成長鏈用的。(C) 核酸在 260 nm 吸光，280 是蛋白質。(D) 合成 DNA 要用帶 d 的原料（dATP 等）。"}, {"q": "對於嘌呤核苷酸(purine nucleotides)分解的敘述，下列何者正確？", "o": ["人體內嘌呤核苷酸分解過程是由核苷酸(nucleotides)降解為核苷(nucleosides)，再由核苷降解為鹼基，最後形成終產物", "人體內嘌呤核苷酸分解過程包括還原作用(reduction)與轉胺作用(transamination)", "人體內具有酵素可將嘌呤環狀結構打開而形成中間產物尿囊素(allantoin)", "人體內分解嘌呤之最終產物為尿素(urea)"], "a": 0, "e": "嘌呤分解就像拆零件：先拿掉磷酸（核苷酸→核苷），再拿掉糖（核苷→鹼基），最後變成尿酸。\n(C) 人沒有把尿酸再分解的酵素。(D) 尿素是胺基酸的氮代謝產物。", "m": "嘌呤→尿酸，這也是痛風的原因。"}, {"q": "下列關於嘌呤核苷(purine nucleosides)分解的敘述，何者正確？", "o": ["分解之最終產物為尿素(urea)", "分解過程包括去胺作用(deamination)", "分解過程最後一步驟為還原作用(reduction)", "若嘌呤核苷磷酸酶(purine nucleoside phoshorylase)缺乏，會導致貧血"], "a": 1, "e": "腺苷在分解時會被拿掉胺基，這就是去胺作用，所以 (B) 對。\n(A) 最終是尿酸，不是尿素。(C) 最後一步是氧化（黃嘌呤氧化酶）。(D) PNP 缺乏影響的是 T 細胞免疫。"}, {"q": "核苷酸包含有鹼基(base)、五碳糖(ribose)與磷酸(phosphoric acid)。其中鹼基是接在五碳糖的那個碳上？", "o": ["1'", "2'", "3'", "5'"], "a": 0, "e": "記住五碳糖的編號：鹼基接 1’，磷酸接 5’，下一個核苷酸接 3’。", "m": "1 鹼基、5 磷酸、3 接下一個。"}, {"q": "華生(James-Watson)與克里克(Francis-Crick)是參考下列哪一位學者所做的X-射線繞射圖譜，而提出DNA的立體結構？", "o": ["孟德爾(Gregor-Mendel)", "洒吞(Walter-Sutton)", "巴夫萊(Theodor-Boveri)", "富蘭克林(Rosalind-Franklin )"], "a": 3, "e": "X 光繞射圖是富蘭克林拍的，華生與克里克看到後才推出雙螺旋。\n其他三位都是更早研究遺傳或染色體的人。"}, {"q": "有關遺傳物質的敘述，下列何者正確？", "o": ["所有具遺傳能力者均以DNA為遺傳物質", "真核生物以DNA為遺傳物質，原核生物以RNA為遺傳物質", "目前僅有部分病毒以RNA為遺傳物質，其他均是以DNA為遺傳物質", "生物可以任意使用DNA或RNA為遺傳物質"], "a": 2, "e": "細胞生物全部用 DNA，只有部分病毒用 RNA（例如流感病毒）。\n所以 (A) 太絕對，(B) 原核也是用 DNA，(D) 不能任意使用。"}, {"q": "營養與基因間的交互作用不包括下列何者？", "o": ["營養素可以影響基因表現", "基因變異(基因多型性)可影響營養素的代謝或需求", "營養素可影響表觀遺傳(epigenetics)(DNA或組蛋白的甲基化或乙醯化)", "營養素可以直接改變DNA序列"], "a": 3, "e": "營養可以調控基因的開關，但不會把 DNA 的字母改掉。\n打個比方：DNA 是食譜，營養是決定今天翻到哪一頁，並不是改寫食譜內容。所以 (D) 不對。"}, {"q": "下列關於人類DNA的敘述，何者正確？", "o": ["為一環狀雙股(circular double-helical)結構", "約有1%之細胞中DNA位於粒線體(mitochondria)", "不到10%基因組(genome)具有重複序列(repetitive sequences)", "DNA之蛋白質譯碼(coding)區域不會出現外顯子(exon)介入序列(intervening sequences)"], "a": 1, "e": "(B) 對：大部分 DNA 在細胞核，少量（約 1%）在粒線體。\n(A) 細胞核 DNA 是線性，環狀的是細菌和粒線體。(C) 重複序列約占一半以上。(D) 真核基因的編碼區常被內含子隔開。"}, {"q": "關於DNA (deoxyribonucleic acid)結構的敘述，下列何者正確？", "o": ["DNA之去氧核苷酸(deoxynucleotide)組成，包括去氧腺嘌呤核苷酸(deoxyadenylate)、去氧胞嘧啶核苷酸(deoxycytidylate)、胸腺嘧啶核苷酸(thymidylate)及尿嘧啶核苷酸(uridylate)", "DNA分子之去氧腺苷核苷酸(deoxyadenosine nucleotide)濃度與胸苷核苷酸(thymidine nucleotide)濃度相同", "DNA雙股螺旋結構主要是由嘌呤(purine)與嘧啶(pyrimidine)間的共價鍵(covalent bond)來維繫", "大部分DNA雙股螺旋是左旋(left handed)，即逆時鐘形式"], "a": 1, "e": "雙股裡 A 一定對 T，所以 A 和 T 數量相同，(B) 對。\n(A) DNA 沒有 U。(C) 兩股之間靠氫鍵，不是共價鍵。(D) 常見 DNA 是右旋。", "m": "A=T、G≡C，數量也相等。"}, {"q": "基因變異可能影響我們對食物的耐受度，下列敘述何者錯誤？", "o": ["乳糖酶(lactase, LCT)基因變異與乳製品耐受度有關", "醛脫氫酶(aldehyde dehydrogenase, ALDH)基因與醇脫氫酶(alcohol dehydrogenase, ADH)基因變異與咖啡因耐受度有關", "亞甲基四氫葉酸還原酶(methylene tetrahydrofolate reductase, MTHFR)基因變異與葉酸需要量有關", "人類白血球抗原(human leukocyte antigen, HLA)基因變異與麩質耐受度有關"], "a": 1, "e": "這題是把基因和對應食物配對。\nLCT 配乳糖，MTHFR 配葉酸，HLA 配麩質，都對。\nALDH、ADH 是分解酒精的酵素，與咖啡因無關，所以 (B) 錯。喝酒臉紅就與 ALDH 有關。"}, {"q": "下列有關遺傳訊息表現的敘述，何者錯誤？", "o": ["轉譯作用在核糖體進行", "複製時DNA聚合酶作用的方向為5端朝向3端", "轉譯的起始位置稱為啟動子(promoter)", "原核細胞遺傳訊息的轉錄與轉譯同時進行"], "a": 2, "e": "啟動子是「轉錄」開始的地方，在 DNA 上。轉譯從 mRNA 上的起始密碼子 AUG 開始。(C) 把兩者混在一起，所以錯。\n(D) 原核沒有細胞核，邊轉錄邊轉譯。", "m": "啟動子管轉錄，AUG 管轉譯。"}, {"q": "下列那個現象最能顯示DNA為遺傳物質？", "o": ["RNA的生物合成必須以單股DNA做為模版", "DNA的轉化作用(transformation)能改變細菌的表型(phenotype)", "DNA存在於原核生物中", "DNA存在於所有的真核的細胞核中"], "a": 1, "e": "要證明 DNA 是遺傳物質，必須看到「放進 DNA，性狀就改變」。(B) 的轉化作用正是這樣。\n其他選項只說 DNA 存在或當模板，沒有證明它能傳遞性狀。"}, {"q": "下列關於當時發現DNA構造的敘述，何者錯誤？", "o": ["DNA為雙股螺旋結構", "DNA構造的外側是五碳糖、內側是含氮鹼基", "DNA由兩條方向相同且平行的核苷酸鏈組成", "DNA雙股間以氫鍵互相連接"], "a": 2, "e": "DNA 兩股方向相反，一條 5’→3’，另一條 3’→5’，像上下行車道。(C) 說方向相同，所以錯。", "m": "反向平行。"}, {"q": "去氧核糖核酸(DNA)雙股螺旋(double helix)結構為二十世紀最偉大的發現之一。雙股螺旋結構之穩定性主要來自下列何者？", "o": ["鄰近嘧啶(pyrimidine)間之氫鍵", "鄰近嘌呤(purine)間之氫鍵", "不同股DNA嘌呤(purine)與嘧啶(pyrimidine)間之氫鍵", "雙股螺旋結構本身"], "a": 2, "e": "四個選項裡只有 (C) 正確描述配對：一股的嘌呤對另一股的嘧啶，靠氫鍵連接。\n(A)(B) 講的是同一股相鄰鹼基，它們之間不靠氫鍵配對。"}, {"q": "關於嘌呤(purine)與嘧啶(pyrimidine)的敘述，下列何者錯誤？", "o": ["嘌呤與嘧啶結構皆含有N (nitrogen)", "嘌呤的環狀結構較嘧啶的環狀結構小", "guanine為一種嘌呤", "thymine結構含有甲基(-CH₃)"], "a": 1, "e": "嘌呤是雙環，嘧啶是單環，所以嘌呤較大，(B) 錯。\n記 A、G 是嘌呤，C、T、U 是嘧啶。T 比 U 多一個甲基。", "m": "嘌呤雙環比較大。"}, {"q": "何者可提供嘌呤(purine)生合成環狀結構之C來源？", "o": ["葡萄糖(glucose)", "甲硫胺酸(methionine)", "N₁₀-甲醛四氫葉酸(N₁₀-formyl-tetrahydrofolate)", "丙酮酸(pyruvate)"], "a": 2, "e": "嘌呤環的碳來自葉酸衍生物，就是 N¹⁰-甲醯四氫葉酸。\n這也說明葉酸不足時，DNA 合成會受影響，紅血球做不好，形成巨球性貧血。"}, {"q": "請指出何者不是核糖核酸(ribonucleic acid, RNA)的特性？", "o": ["其五碳2'位置上為羥基(hydroxy group, -OH)", "很多核糖核酸如tRNA能形成雙螺旋構造", "在RNA的分子內A和G可分別與U和C形成氫鍵", "在RNA的分子內A和U，以及G和C的量均等"], "a": 3, "e": "RNA 大多是單股，沒有全部配對，所以 A 不必等於 U，(D) 錯。\nA=T、G=C 這條規則只適用雙股 DNA。(B)(C) 是 RNA 局部摺疊配對的情況。"}, {"q": "依照華生和克立克的DNA分子模型，當我們知道某DNA分子其中一股的鹽基排列次序為5’-AATTGC-3’時，另一股的鹽基排列次序應為何？", "o": ["AATTGC", "TTGGAC", "TTAACG", "TTAAGC"], "a": 2, "e": "配對規則：A↔T、G↔C。\n5’-AATTGC-3’ 一個一個配：T T A A C G，所以是 (C)。這是由 3’ 往 5’ 的方向寫。"}, {"q": "寡核酸5’-GTGATCAAGC-3’可與下列何者形成雙股結構？", "o": ["5’-GTCCGACTGC-3’", "5’-CACTAGTTCG-3’", "5’-CACATTCGCC-3’", "5’-GCTTGATCAC-3"], "a": 3, "e": "做雙股題要兩步：先配對，再把方向反過來。\n原股 GTGATCAAGC → 配對得 CACTAGTTCG（這是 3’→5’）→ 倒過來 5’-GCTTGATCAC-3’。\n(B) 是只配對沒有反向的陷阱。", "m": "先配對，再反轉。"}, {"q": "下列何者為迴文序列(palindromic sequence)？", "o": ["AGGTCC TCCAGG", "GGATCC CCTAGG", "CCTTCC GCAAGG", "GAATCC CTTAGG"], "a": 1, "e": "迴文序列就是兩條股都從 5’ 往 3’ 讀，內容相同。\n(B) 上股 GGATCC；下股 CCTAGG 從右讀回來（它的 5’ 端在右邊）也是 GGATCC。限制酶常辨認這種序列。"}, {"q": "有關complementary DNA (cDNA)的敘述，下列何者正確？", "o": ["一股RNA與另一股與其互補的DNA組成的雙股結構", "一股RNA與另一股與其互補的RNA組成的雙股結構", "一段RNA經反轉錄作用後形成的雙股DNA", "一段RNA經環化作用後形成的環狀雙股 DNA"], "a": 2, "e": "cDNA 就是「用 RNA 抄回來的 DNA」。反轉錄先做出單股，再補成雙股 DNA，所以 (C)。\n它是 DNA，不含 RNA，(A)(B) 不對。"}, {"q": "真核細胞之互補性DNA (complementary DNA, cDNA)會與下列哪一種核酸序列互補？", "o": ["mRNA", "rRNA", "tRNA", "snRNA"], "a": 0, "e": "cDNA 的模板是 mRNA，用來保留已經剪接好、真正要表現的基因資訊。"}, {"q": "下列那個酵素可用RNA當模版合成互補DNA (cDNA)？", "o": ["DNA聚合酶(polymerase)", "反轉錄酶(reverse transcriptase)", "RNA聚合酶", "限制酶(restriction enzymes)"], "a": 1, "e": "一般的流程是 DNA→RNA。要反過來由 RNA 做 DNA，就要反轉錄酶。HIV 也有這個酵素。", "m": "反轉錄＝RNA 變 DNA。"}, {"q": "那種酵素可從mRNA製造cDNA？", "o": ["restriction endonuclease", "reverse transcriptase", "DNA ligase", "RNA Polymerase"], "a": 1, "e": "與第 39 題相同觀念：mRNA→cDNA 靠反轉錄酶。\n限制酶負責剪 DNA，連接酶負責接 DNA，RNA 聚合酶負責做 RNA。"}, {"q": "下列有關DNA雙螺旋結構的敘述何者有誤？", "o": ["DNA螺旋的兩股其配對鹼基對之間以氫鍵結合", "加熱DNA水溶液可以瓦解此DNA雙螺旋結構", "當DNA雙螺旋結構瓦解成單股時，其紫外光的吸光值會減少", "加酸或鹼到DNA水溶液可以瓦解此DNA雙螺旋結構"], "a": 2, "e": "雙股時鹼基疊在一起，吸光被壓低。解開後鹼基露出來，吸光值反而增加，所以 (C) 說減少是錯的。", "m": "解開＝變亮（吸光增加）。"}, {"q": "關於嘧啶(pyrimidine)分解的敘述，下列何者正確？", "o": ["分解之最終產物為水溶性物質", "分解之最終產物為尿酸(uric acid)", "分解異常會導致痛風性關節炎(gouty arthritis)", "若二氫嘧啶去氫酶(dihydropyrimidine dehydrogenase)缺乏，會導致酸尿症(aciduria)"], "a": 0, "e": "痛風和尿酸都屬於嘌呤，所以 (B)(C) 是嘧啶題的陷阱。\n嘧啶分解成的產物易溶於水，容易排出，(A) 對。", "m": "嘌呤難溶成尿酸，嘧啶易溶水。"}, {"q": "cytosine(胞嘧啶)屬於下列那種？", "o": ["base", "nucleoside", "nucleotide", "nucleic acid"], "a": 0, "e": "分清三層：鹼基 base（胞嘧啶）→ 加糖成核苷 nucleoside（胞苷）→ 再加磷酸成核苷酸 nucleotide。cytosine 是最基本的鹼基。"}, {"q": "下列那一種RNA之5'端(5’-hydroxyl)及3'端(3’-hydroxyl)之核糖(ribose)，最可能同時具有free 3'-OH？", "o": ["真核細胞mRNA", "原核細胞mRNA", "真核細胞rRNA", "原核細胞rRNA"], "a": 0, "e": "問的是哪種 RNA 頭尾兩端的糖都有 3’-OH。一般 RNA 的頭端是磷酸接 5’，3’-OH 在尾端。\n真核 mRNA 因為多戴一個反向接上的帽子，帽子的糖也有 free 3’-OH，所以頭尾都有。"}, {"q": "在ATP中，α-phosphate與核糖(ribose)的鍵結稱為：", "o": ["ester linkage(酯鍵)", "covalent linkage(共價鍵)", "disulfide linkage(二硫鍵)", "anhydride linkage(酸酐鍵)"], "a": 0, "e": "磷酸接在糖上形成酯鍵。磷酸和磷酸之間才是高能的酸酐鍵，也就是 ATP 儲能的地方。", "m": "磷接糖是酯，磷接磷是酐。"}, {"q": "有關核酸(nucleic acids)結構之敘述，下列何者正確？", "o": ["核酸是以雙硫鍵(disulfide bond)連接各核苷酸(nucleotides)單體結構", "核酸初級結構(primary structure)之序列是由鹼基序列決定", "DNA次級結構(secondary structure)是以磷酸二酯鍵(phosphodiester bond)連結兩個單股，以形成雙股螺旋", "DNA雙股螺旋結構中，C鹼基會與T鹼基形成鍵結"], "a": 1, "e": "一級結構就是鹼基的排列順序，所以 (B) 對。\n(A) 應是磷酸二酯鍵。(C) 兩股靠氫鍵連接。(D) C 配 G。"}, {"q": "核酸(nucleic acid)的組成單元(building block)，下列何者敘述正確？", "o": ["氮鹼基(nitrogen base)", "核苷(nucleoside)", "核苷酸(nucleotide)", "核蛋白(nucleoprotein)"], "a": 2, "e": "就像蛋白質的單元是胺基酸，核酸的單元是核苷酸。鹼基和核苷都只是零件。", "m": "核酸由核苷酸串成。"}, {"q": "下列有關DNA和RNA化學組成的敘述，何者正確？", "o": ["兩者的嘌呤種類皆相同", "兩者的嘧啶種類皆相同", "兩者有相同的五碳糖", "兩者的嘌呤總量皆等於嘧啶總量"], "a": 0, "e": "嘌呤 A、G 兩者都有，所以 (A) 對。\n(B) DNA 用 T，RNA 用 U。(C) 糖不同。(D) RNA 單股，不一定相等。"}, {"q": "下列那一項是DNA和RNA共同的特性？", "o": ["皆為雙股α螺旋鏈", "合成過程都具有相同校正機制避免錯誤", "皆含有磷酸根、醣及鹼基", "在五碳糖的第二個位置都是-OH基"], "a": 2, "e": "(C) 是核苷酸的三個零件，DNA、RNA 都有。\n(A) RNA 多單股。(D) 去氧核糖的 2’ 沒有 -OH，名稱「去氧」就是這個意思。"}, {"q": "下列何種含氮鹼基一般不存於DNA中？", "o": ["尿嘧啶(uracil)", "腺嘌呤(adenine)", "胞嘧啶(cytosine)", "鳥糞嘌呤(guanine)"], "a": 0, "e": "U 是 RNA 專用。DNA 用 T 取代 U。"}, {"q": "不會出現於DNA中之含氮鹼基為：", "o": ["adenine", "guanine", "uracil", "cytosine"], "a": 2, "e": "與上一題相同：U 只在 RNA。"}, {"q": "下列何種鹼基不存於一般RNA分子？", "o": ["腺嘌呤(adenine)", "尿嘧啶(uracil)", "胸腺嘧啶(thymine)", "胞嘧啶(cytosine)"], "a": 2, "e": "反過來問：T 是 DNA 專用，一般 RNA 不含 T。"}, {"q": "DNA的雙股螺旋結構是依賴其A-T和C-G鹼基對的何種作用力來維持？", "o": ["共價鍵", "離子鍵", "氫鍵", "凡得瓦力"], "a": 2, "e": "配對靠氫鍵。共價鍵是把同一條鏈串起來的力量。", "m": "兩股之間＝氫鍵。"}, {"q": "DNA的組成中含氮鹼基、五碳糖、磷酸的比例為何？", "o": ["1:1:1", "1:1:2", "1:1:3", "1:2:3"], "a": 0, "e": "一個核苷酸有鹼基、糖、磷酸各一個，所以比例是 1:1:1。"}, {"q": "假設分析某生物體的基因體實驗中發現，核酸中的adenine含量約為20%，則此基因體的guanine含量為何？", "o": ["10%", "20%", "30%", "40%"], "a": 2, "e": "A 是 20%，T 也是 20%，合計 40%。剩下 60% 由 G、C 平分，G=30%。"}, {"q": "某段雙股DNA具有100個去氧核糖、24個腺嘌呤，則該段DNA共含有幾個胞嘧啶？", "o": ["100", "24", "26", "50"], "a": 2, "e": "100 個去氧核糖代表共 100 個核苷酸。A=T=24，共 48。剩下 52 由 G、C 平分，C=26。", "m": "A+C＝總數一半，所以 100÷2−24＝26。"}, {"q": "一段雙股DNA，共有磷酸：100個，鳥糞嘌呤(guanine)：20個，則下列相關敘述何者正確？", "o": ["胸腺嘧啶20個", "胞嘧啶30個", "去氧核糖50個", "氫鍵120個"], "a": 3, "e": "磷酸 100 個代表 100 個核苷酸。G=C=20，A=T=30。\nA-T 有 2 個氫鍵，G-C 有 3 個：30×2＋20×3＝120，所以 (D)。\n(A) T 是 30，(B) C 是 20，(C) 去氧核糖 100。"}, {"q": "雙股DNA中的一股核苷組成比率分別為A:24.5%, T:26.5%, C:25.8%, G:23.2%，與其互補的另一股核苷組成為何？", "o": ["A:25.8%, T:26.5%, C:23.2%, G:24.5%", "A:24.5%, T:26.5%, C:25.8%, G:23.2%", "A:26.5%, T:24.5%, C:23.2%, G:25.8%", "A:23.2%, T:24.5%, C:26.5%, G:25.8%"], "a": 2, "e": "互補股的數字要交叉對調：新 A＝原 T（26.5）、新 T＝原 A（24.5）、新 C＝原 G（23.2）、新 G＝原 C（25.8）。", "m": "A、T 互換，C、G 互換。"}, {"q": "在相同的酸鹼及離子濃度環境下，已知其中一股之鹼基(base)組成如下所列，則何種雙股DNA之melting point (Tm)最高？", "o": ["A: 26.5%, T:24.5%, C:23.2%, G:25.8%", "A: 25.8%, T:26.5%, C:23.2%, G:24.5%", "A: 23.2%, T:24.5%, C:26.5%, G:25.8%", "A: 24.5%, T:26.5%, C:25.8%, G:23.2%"], "a": 2, "e": "Tm 越高代表越難解開。G-C 有 3 個氫鍵，所以比較 G+C 總和：(A) 49.0、(B) 47.7、(C) 52.3、(D) 49.0。(C) 最高。"}, {"q": "某 DNA分子中的A和T占所有含氮鹼基的40%，則由此DNA分子轉錄而來的RNA分子，其中的C和G應占所有鹼基的多少？", "o": ["30%", "40%", "60%", "80%"], "a": 2, "e": "DNA 的 A+T 占 40%，G+C 就是 60%。雙股互補時，比例會同時出現在兩股，每股的 G+C 也是 60%。RNA 由其中一股抄下來，所以 C+G 也是 60%。", "n": "講義解析寫 60/2＝30%，但比例不會因為只轉錄單股而減半。請向老師確認標準答案。"}, {"q": "一個真核細胞的細胞核中的一段DNA含有20%的A＋T，那麼此段DNA中，G的含量應為何？", "o": ["0%", "20%", "40%", "80%"], "a": 2, "e": "A+T＝20%，G+C＝80%，由 G、C 平分，G＝40%。"}, {"q": "實驗室通常利用DNA對於下列何種波長之吸光情形而進行DNA之定量？", "o": ["230 nm", "260 nm", "280 nm", "320 nm"], "a": 1, "e": "記住三個波長：260 核酸、280 蛋白質、230 雜質（鹽類）。", "m": "二六核酸、二八蛋白。"}, {"q": "核酸分子可在260 nm產生吸光值主要是因為：", "o": ["鹼基", "五碳糖", "磷酸根", "磷酸雙酯鍵"], "a": 0, "e": "鹼基有環狀共軛結構，是吸收紫外光的部位。糖和磷酸幾乎不吸收 260 nm。"}, {"q": "蛋白質的最大吸收波長nm，下列何者敘述正確？", "o": ["230 nm", "260 nm", "280 nm", "320 nm"], "a": 2, "e": "蛋白質看 280 nm，來自芳香族胺基酸。"}, {"q": "實驗室利用280 nm吸光值定量蛋白質是常用的方式，蛋白質的那一個胺基酸被破壞時會影響吸光值？", "o": ["天冬胺基酸(aspartic acid)", "絲胺基酸(serine)", "甲硫胺基酸(methionine)", "色胺基酸(tryptophan)"], "a": 3, "e": "280 nm 靠芳香環：色胺酸、酪胺酸。四個選項中只有色胺酸有芳香環。"}, {"q": "有關於殘留有機鹽類的定量，是偵測下列何種波長之吸光值？", "o": ["230 nm", "260 nm", "280 nm", "320 nm"], "a": 0, "e": "230 nm 看雜質。A260/A230 太低，代表鹽類等污染物多。"}, {"q": "因核酸溶液中的pH值會影響OD260/OD280 ratio時，所以建議測定核酸品質時的pH值為：", "o": ["5.5", "6.5", "7.5", "8.5"], "a": 2, "e": "測定純度時要用弱鹼性的緩衝液，因為酸鹼值會改變 OD260/OD280 的比值，在純水或酸性環境下，比值會偏低。", "n": "講義解析沒有說明 pH 值，而 (C)(D) 都落在一般建議範圍內，這題我無法確定標準答案，請向老師確認。另外講義寫純 DNA 的 OD260/280 為 1.6～1.8，一般常見標準約為 1.8。"}, {"q": "核酸分子在紫外光譜(約260 nm左右)有很好的吸光性質，是因為核酸分子結構的哪個部分所致？", "o": ["五碳核糖", "磷酸雙酯鍵(phosphodiester bond)", "含氮鹼基(nitrogen bases)", "核糖之5'-C所連接的磷酸"], "a": 2, "e": "與第 63 題相同：吸光來自鹼基的環狀結構。"}, {"q": "當雙股DNA在中性pH下加熱，下列何種變化不會發生？", "o": ["UV 260 nm吸光值增加", "氮鹼基間的氫鍵被破壞", "在氮鹼基與五碳醣間的糖苷鍵(glycosidic bond)被打斷", "雙股螺旋鬆開"], "a": 2, "e": "加熱只打斷弱的氫鍵。鹼基與糖之間是共價的糖苷鍵，沒那麼容易斷，所以 (C) 不會發生。", "m": "變性只斷氫鍵。"}, {"q": "關於雙股核酸分子：①DNA-DNA ②RNA-RNA ③DNA-RNA，對熱穩定性的比較，下列排序何者正確？", "o": ["①＞③＞②", "①＞②＞③", "②＞③＞①", "②＞①＞③"], "a": 2, "e": "RNA 多一個 2’-OH，雙股結構更緊，最穩定。DNA 雙股最不穩定，混合雙股介於中間。", "m": "RNA 越多越穩定：RNA-RNA＞DNA-RNA＞DNA-DNA。"}, {"q": "關於RNA的敘述，下列那些正確？①不含有胸腺嘧啶之組成，②在正常生理狀況下，RNA分子帶負電荷，③不易被強鹼水解，④在波長260 nm下具有很強的吸光值。", "o": ["①②③", "①②④", "①③④", "②③④"], "a": 1, "e": "①對：RNA 用 U 不用 T。②對：磷酸帶負電。④對：鹼基吸收 260 nm。\n③錯：RNA 的 2’-OH 會自己攻擊骨架，遇強鹼很容易斷掉。這也是 RNA 比 DNA 不穩定的原因。"}, {"q": "構成多核苷酸鏈(polynucleotide strands)骨架的關鍵是下列何者？", "o": ["2’, 3’-磷酸二酯鍵", "2’, 4’-磷酸二酯鍵", "2’, 5’-磷酸二酯鍵", "3’, 4’-磷酸二酯鍵", "3’, 5’-磷酸二酯鍵"], "a": 4, "e": "相鄰核苷酸是用前一個的 3’ 和後一個的 5’，透過磷酸相連，所以是 3’,5’-磷酸二酯鍵。"}, {"q": "在雙股DNA中每一鹼基對(base pair)以何種力量鍵結？", "o": ["親和鍵(affinity bond)", "共價鍵(covalent bond)", "氫鍵(hydrogen bond)", "雙硫鍵(disulfide bond)"], "a": 2, "e": "鹼基對靠氫鍵。雙硫鍵是蛋白質才有的。"}, {"q": "下列有關DNA與RNA的敘述，何者錯誤？", "o": ["在生理狀況下，RNA分子帶負電荷", "DNA之Tm與(G+C)%成正比", "變性的DNA其UV 260 nm之吸光值會降低", "鹼基不同"], "a": 2, "e": "DNA 變性解開時，260 吸光值升高（增色效應），(C) 說降低是錯的。"}, {"q": "下列關於DNA與RNA的敘述，何者是錯誤的？", "o": ["DNA攜帶遺傳密碼", "RNA中的含氮鹼基中可與adenine形成配對的uracil", "以DNA為模板合成RNA稱為轉錄(transcription)", "RNA構造中之五碳糖是去氧核糖"], "a": 3, "e": "「去氧」就是少一個氧，所以 RNA 是核糖，DNA 才是去氧核糖。(D) 反了。"}, {"q": "下列有關DNA與RNA的說明，何者錯誤？", "o": ["DNA主要為雙股構造，RNA則為單股構造", "DNA的核糖結構，比RNA多了一個氧原子", "DNA的含氮鹼基，為A、G、T、C四種", "mRNA上的鹼基序列，可提供合成蛋白質的訊息的"], "a": 1, "e": "去氧核糖比核糖少一個氧。(B) 說 DNA 多一個氧，反了。"}, {"q": "人體內之DNA大部分以哪一種型式存在？", "o": ["B-form", "E-form", "H-form", "Z-form"], "a": 0, "e": "人體 DNA 大多是 B 型。", "m": "記 B 型最常見。"}, {"q": "下列何者為細胞內最常見之雙股DNA結構？", "o": ["A-form", "B-form", "Z-form", "hairpin"], "a": 1, "e": "與上一題相同：細胞內最常見 B 型。"}, {"q": "由細胞萃取純化出之DNA其二級結構主要是：", "o": ["A-DNA", "B-DNA", "C-DNA", "Z-DNA"], "a": 1, "e": "與上一題相同：抽出來的 DNA 仍是 B 型。"}, {"q": "Watson和Crick因闡釋DNA結構而獲頒諾貝爾獎，然而目前已知DNA分子在不同環境條件下，其螺旋結構可能 會發生改變，例如螺旋的緊密程度和螺旋的走向等。試問Watson和Crick當年是闡釋下列哪一型雙股DNA分子的結構？", "o": ["A-form", "B-form", "D-form", "Z-form"], "a": 1, "e": "Watson 和 Crick 的模型就是最標準的 B 型。"}, {"q": "有關於三種不同雙螺旋DNA結構(A form; B form; Z form)的特性，請指出下表代號甲、乙、丙的結構型式(structural form)名稱？", "o": ["甲= Z form DNA; 乙= A form DNA; 丙= B form DNA", "甲= Z form DNA; 乙= B form DNA; 丙= A form DNA", "甲= A form DNA; 乙= Z form DNA; 丙= B form DNA", "甲= A form DNA; 乙= B form DNA; 丙= Z form DNA"], "a": 0, "e": "只有 Z 型左旋，所以左旋的甲一定是 Z。\nB 型的標準數據是每圈 10 個鹼基、間距 0.34 nm，所以丙是 B，剩下的乙是 A。", "m": "看到左旋就選 Z。", "tb": ["| 型式 | 雙螺旋的轉向 | 每一螺旋上的鹼基數 | 每個鹼基的間距 |", "| 甲 | 左旋 | 12個鹼基 | 0.37 nm |", "| 乙 | 右旋 | 11個鹼基 | 0.255 nm |", "| 丙 | 右旋 | 10個鹼基 | 0.34 nm |"]}, {"q": "核苷(nucleoside)是由下列哪些物質組成？1.五碳糖，2.六碳糖，3.磷酸，4.含氮鹼基。", "o": ["1、4", "2、4", "1、3、4", "2、3、4"], "a": 0, "e": "核「苷」＝糖＋鹼基。核「苷酸」才多一個磷酸。", "m": "有「酸」才有磷酸。"}, {"q": "核酸(nucleic acid)的組成單元(building block)是：", "o": ["核苷(nucleoside)", "核苷酸(nucleotide)", "核蛋白(nucleoprotein)", "氮鹼基(嘌呤或嘧啶)"], "a": 1, "e": "與第 47 題相同：核酸由核苷酸組成。"}, {"q": "核苷酸分子中含有下列哪幾種元素？(甲).碳；(乙).磷；(丙).鐵；(丁).氫；(戊).氯。", "o": ["甲、乙、丁", "甲、丙、丁", "乙、丙、丁", "甲、丁、戊"], "a": 0, "e": "核苷酸由 C、H、O、N、P 組成，沒有鐵，也沒有氯。\n選項中能選的只有碳、磷、氫（甲、乙、丁）。", "m": "DNA 有 P 沒有 S。"}, {"q": "DNA的雙股螺旋結構，鹼基對之間是藉著何種鍵結形成：", "o": ["雙硫鍵", "磷酸雙酯鍵", "氫鍵", "離子鍵"], "a": 2, "e": "鹼基對之間是氫鍵。磷酸雙酯鍵是骨架。"}, {"q": "下列哪種胞器或細胞部位不含RNA？", "o": ["核糖體", "染色體", "高爾基氏體", "細胞核"], "a": 2, "e": "RNA 在哪裡？核糖體有 rRNA，細胞核有各種 RNA，染色體上也會有正在合成的 RNA。高爾基氏體負責包裝蛋白質，不含 RNA。"}, {"q": "下列何者整體分子結構最小？", "o": ["nucleic acid", "nucleotide", "nucleosome", "nucleoside"], "a": 3, "e": "排大小：核苷（糖＋鹼基）＜核苷酸（多磷酸）＜核酸（長鏈）＜核小體（DNA 繞組蛋白）。最小是核苷。"}, {"q": "因結晶DNA由X-光繞射後可以得知其結構特性，下列何者正確？", "o": ["雙螺旋的直徑", "複製速率", "核苷酸序列", "鍵結角度"], "a": 0, "e": "X 光繞射看到的是分子形狀，例如螺旋粗細。不能看出 ATGC 的序列。"}, {"q": "DNA變性(denaturation)後，下列哪一項變化是正確的？", "o": ["對260 nm紫外線(UV)吸收減少", "溶液黏度下降", "磷酸二酯鍵斷裂", "核苷鍵斷裂", "嘌呤環破裂"], "a": 1, "e": "長長的雙股 DNA 像硬棍，溶液較黏。變性後成軟的單股，黏度下降，所以 (B)。\n(A) 應是增加。(C)(D)(E) 都是共價鍵，沒有斷。"}, {"q": "DNA變性是指：", "o": ["分子中磷酸二酯鍵斷裂", "多核苷酸鏈解聚", "DNA分子中鹼基缺失", "DNA分子由超螺旋→雙鏈雙螺旋", "互補鹼基之間氫鍵斷裂"], "a": 4, "e": "變性就是兩股分開，也就是氫鍵斷了。DNA 序列還在。", "m": "變性＝斷氫鍵。"}, {"q": "雙鏈DNA因加熱而變性(denature)時，在波長260 nm的照射下，其吸光度(absorbance)有增加的現象，此現象稱為增色效應，其原因為何？", "o": ["變性時其亂度增加而引起的反應", "變性時其體積增加，因而吸光度也隨之而增加", "因鹼基中的嘧啶與嘌呤外露而增加其吸光度", "因五碳糖和磷酸根外露而增加其吸光度"], "a": 2, "e": "雙股時鹼基被藏在中間，互相壓低吸光。解開後嘌呤、嘧啶外露，吸光增加。\n(D) 糖與磷酸不是吸光來源。"}, {"q": "Tm值是描述雙股DNA有一半的鏈結被打開而成單股時的溫度，下列的敘述，何者錯誤？", "o": ["Tm值和DNA中的GC含量有關", "Tm值和溶液中離子的濃度有關", "Tm值和溶液中的pH值無關", "Tm值和DNA的長度有關"], "a": 2, "e": "Tm 會受 G+C 含量、DNA 長度、離子濃度、pH 影響。(C) 說與 pH 無關，所以錯。極酸或極鹼都會讓 DNA 解開。"}, {"q": "DNA的G+C含量愈多，則下列有關DNA之敘述何者正確？", "o": ["右旋性愈大", "密度愈低", "Tm值愈高", "愈容易變性"], "a": 2, "e": "G≡C 有 3 個氫鍵，比較難解開，所以 Tm 高。(D) 正好相反。"}, {"q": "有關於DNA的Tm值，下列敘述何者正確？", "o": ["Tm是溶液中全部DNA變成雙股螺旋的溫度", "當溫度到達Tm時，溶液中有一半的DNA呈現random coil形態", "當溫度到達Tm時，溶液中全部DNA都變成random coil(隨機螺旋)形態", "當溫度到達Tm時，溶液中沒有DNA呈現random coil形態"], "a": 1, "e": "m 是 melting。Tm 就是一半解開、一半還雙股的溫度，所以 (B)。", "m": "Tm＝解開一半。"}, {"q": "當雙股DNA在中性pH下加熱，下列何種變化不會發生？", "o": ["雙股螺旋鬆開", "UV 260 nm吸光值增加", "氮鹼基間的氫鍵被破壞", "在氮鹼基與五碳醣間的糖苷鍵被打斷"], "a": 3, "e": "與第 69 題相同：加熱不會打斷糖苷鍵。"}, {"q": "下列有關DNA雙螺旋結構的敘述何者有誤？", "o": ["DNA螺旋的兩股其配對鹼基對之間以氫鍵結合", "加熱DNA水溶液可以瓦解此DNA雙螺旋結構", "當DNA雙螺旋結構瓦解成單股時，其紫外光的吸光值會減少", "加酸或鹼到DNA水溶液可以瓦解此DNA雙螺旋結構"], "a": 2, "e": "與第 41 題相同：解開時吸光增加，不是減少。"}, {"q": "DNA復性(renaturation)的重要標誌是：", "o": ["溶解度降低", "溶液黏度降低", "紫外線吸收增大", "紫外線吸收降低"], "a": 3, "e": "復性是變性的反向。變性時吸光上升，復性時鹼基重新疊回去，吸光下降。"}, {"q": "有關於DNA變性的敘述，下列何者正確？", "o": ["分子中磷酸二酯鍵斷裂", "多核苷酸鏈解聚", "DNA分子中鹼基丟失", "DNA分子由超螺旋→雙鏈雙螺旋", "互補鹼基之間氫鍵斷裂"], "a": 4, "e": "與第 90 題相同：變性＝氫鍵斷裂。"}, {"q": "拓樸異構酶(topoisomerase)可以打斷與重新接合去氧核糖核酸雙股，並每次改變兩個交聯數(linking number)的是屬於那一型？", "o": ["第一型(Type I)", "第二型(Type II)", "第一型與第二型皆會", "第一型與第二型皆只會打斷去氧核糖核酸的一股，並改變一個交聯數"], "a": 1, "e": "第二型切開兩股讓另一段 DNA 穿過，再接回，一次改變 2 個連結數。第一型只切一股，一次改變 1 個。", "m": "二型切二股、改 2。"}, {"q": "下列何種藥物可穩定這些共價鍵結合的拓樸異構酶II-DNA(斷裂的DNA)複合物的作用機轉？", "o": ["喜樹鹼(camptothecin)", "小紅莓(adriamycin)", "抗癌妥(irinotecan)", "癌康定(topotecan)"], "a": 1, "e": "化療藥要分：Adriamycin（小紅莓）→ 第二型。喜樹鹼家族（camptothecin、irinotecan、topotecan，名字都帶 -tecan）→ 第一型。"}, {"q": "有關於核酸(nucleic acid)的敘述，下列何者正確？", "o": ["DNA和RNA中的五碳糖相同", "組成DNA與ATP的元素種類不同", "T2噬菌體的遺傳信息儲存於RNA中", "雙鏈DNA分子中嘌呤等於嘧啶數"], "a": 3, "e": "(D) 對：A 配 T、G 配 C，一個嘌呤配一個嘧啶，總數相同。\n(A) 糖不同。(B) 元素都是 C、H、O、N、P。(C) T2 噬菌體的遺傳物質是 DNA。"}, {"q": "許多蛋白質結合成核醣體，為蛋白質結合處：", "o": ["小核RNA(small nuclear RNA, snRNA)", "核糖體RNA (ribosomal RNA, rRNA)", "微小RNA(microRNA, miRNA)", "小干擾RNA(small interfering RNA, siRNA)"], "a": 1, "e": "ribosomal RNA 字面就是核糖體的 RNA，與蛋白質組成核糖體。"}, {"q": "細胞中種類最多，且半衰期最短的RNA是：", "o": ["tRNA", "rRNA", "snRNA", "mRNA"], "a": 3, "e": "mRNA 每個基因各有一種，所以種類最多；用完就分解，半衰期最短。tRNA 和 rRNA 數量多但種類少。"}, {"q": "真核細胞中，可將原始型mRNA加工為成熟型的是：", "o": ["微小RNA(microRNA, miRNA)", "小核RNA(small nuclear RNA, snRNA)", "小干擾RNA(small interfering RNA, siRNA)", "核糖體RNA (ribosomal RNA, rRNA)"], "a": 1, "e": "剪接 mRNA 的是剪接體，裡面的 RNA 是 snRNA。", "m": "snRNA 在剪接體裡。"}, {"q": "唐氏症發病原因為何？", "o": ["多了一條第21號染色體", "單一顯性基因突變", "染色體末端有缺失", "性聯遺傳基因突變"], "a": 0, "e": "唐氏症又稱 21 三體：第 21 號染色體多一條。"}, {"q": "下列遺傳篩檢技術中，何者最能確診胎兒罹患唐氏症？", "o": ["基因檢驗", "生化檢驗", "染色體檢驗", "超音波檢驗"], "a": 2, "e": "唐氏症是染色體數目問題，要直接數染色體，所以用染色體檢驗（羊膜穿刺等）。"}, {"q": "關於唐氏症的敘述以下何者為非？", "o": ["最常見的形式又稱為第21對染色體異常", "心臟有缺陷、身形矮小，但四肢關節肌肉發展良好", "高齡產婦有較高比例生出唐氏症兒童", "唐氏症與阿茲海默症有所關聯"], "a": 1, "e": "唐氏症者肌肉張力較低，發展較慢，所以 (B)「四肢關節肌肉發展良好」錯。"}, {"q": "細胞核中基因與相關蛋白質連結形成可見的物質，稱為：", "o": ["chromatin(染色質)", "chlorophyll(葉綠素)", "chloroplast(葉綠體)", "chromatophore(色素胞)"], "a": 0, "e": "染色質＝DNA＋蛋白質。其他選項與植物色素有關。"}, {"q": "真核細胞核內的一種纖維狀物質，其由一整套基因體DNA與蛋白質所構成，具調控基因表現的功能。該構造的名稱為何？", "o": ["染色質(chromatin)", "基因(gene)", "中心粒(centrosome)", "核小體(nucleosome)"], "a": 0, "e": "(A) 染色質是整套 DNA 加蛋白質的物質。\n(D) 核小體是其中的一個小單位，不是一整套。"}, {"q": "有關染色質(chromatin)的相關敘述，下列何者最正確？", "o": ["常染色質(euchromatin)是高度緊密結構", "端粒和中節常觀察到常染色質結構", "在光學顯微鏡下無法觀察異染色質(heterochromatin)", "異染色質區域基因不轉錄"], "a": 3, "e": "常染色質鬆，基因可以讀。異染色質緊，基因讀不到，不轉錄。", "m": "鬆才能讀。"}, {"q": "細胞染色質中，何者與DNA結合，而形成染色質單體(nucleosomes)？", "o": ["核仁", "核膜", "組織蛋白(histones)", "RNA"], "a": 2, "e": "DNA 線繞在組蛋白上，像線繞線軸，形成核小體。"}, {"q": "已知形成人類鐮刀形血球貧血症的原因，是由構成血紅素的其中一條蛋白鏈發生一個胺基酸錯誤所引起，則下列敘述何者錯誤？", "o": ["支配血紅素合成的基因異常", "轉譯此條血紅蛋白鏈的RNA異常", "內質網上合成此蛋白鏈的核糖體異常", "錄此條血紅蛋白鏈的DNA異常"], "a": 2, "e": "鐮刀型的問題在基因上。DNA 錯、mRNA 跟著錯、蛋白質錯。製造用的核糖體本身正常，所以 (C) 錯。"}, {"q": "下列何者是細胞中主要合成核醣體(ribosome)中之核醣核酸(RNA)分子的地方？", "o": ["胞漿(cytoplasm)", "核漿(nucleoplasm)", "核仁(nucleolus)", "粒線體(mitochondria)"], "a": 2, "e": "rRNA 由核仁製造。", "m": "核仁＝核糖體工廠。"}, {"q": "細胞週期(cell cycle)中，DNA複製主要在何時期進行？", "o": ["G0 phase", "G1 phase", "G2 phase", "M phase", "S phase"], "a": 4, "e": "S 是 synthesis（合成），DNA 在這期複製。"}, {"q": "若哺乳動物DNA損傷時，不完整之DNA複製(Replication)會發生在細胞週期(Cell cycle）之那一期？", "o": ["G1期", "G2期", "M期", "S期"], "a": 3, "e": "DNA 複製發生在 S 期，複製不完整當然也在這期。"}, {"q": "關於人類DNA的複製修補或與環境交互作用，下列敘述何者正確？", "o": ["遺傳物質DNA只存在細胞核", "細胞週期(cell cycle)過程中可監控DNA是否受損", "沒有修復的體細胞DNA突變將會垂直傳遞給下一代", "RNA病毒在人體可複製但不會嵌入人類染色體"], "a": 1, "e": "(B) 對：細胞有檢查點，發現 DNA 受損會停下來修復。\n(A) 粒線體也有 DNA。(C) 體細胞突變不傳給下一代，生殖細胞才會。(D) 反轉錄病毒（如 HIV）會嵌入染色體。"}, {"q": "關於細胞凋亡(apoptosis)的敘述，下列何者最正確？", "o": ["細胞的 DNA 和胞器碎裂，細胞皺縮形成囊泡(blebs)", "細胞死亡，溶解，胞器被吞噬其內含物被再利用", "細胞的 DNA 和胞器保持完整，細胞死亡且被吞噬", "細胞核與胞器皆溶解，細胞變大然後爆裂"], "a": 0, "e": "凋亡是有計畫的死亡：細胞變小、碎成小泡被清掉，不發炎。\n壞死則是意外：細胞腫大破裂、發炎，(B)(D) 都是壞死。", "n": "講義下一題的比較表寫凋亡「無 DNA 降解」，與本題矛盾。凋亡時 DNA 會被切成片段，以本題為準。"}, {"q": "許多細胞可以精確控制自己的死亡時間，此種細胞死亡被稱為：", "o": ["autophagy(自噬)", "apoptosis(细胞凋亡)", "necrosis(壞死)", "caspase(凋亡蛋白酶)"], "a": 1, "e": "凋亡是自己安排的死亡。autophagy 是回收自己的零件，necrosis 是意外死亡，caspase 只是執行的工具。"}, {"q": "下列關於細胞與細胞週期(cell cycle)的敘述，何者錯誤？", "o": ["處於S phase的細胞主要進行DNA複製(DNA replication)工作", "處於M phase的細胞主要進行細胞分裂", "大部分高度分化的細胞，皆處於S phase", "在快速分裂時，細胞處在S phase的比例增加"], "a": 2, "e": "高度分化的細胞通常已不分裂，處在 G0 期，不會在 S 期，所以 (C) 錯。"}, {"q": "有關細胞週期(cell cycle)之敘述，下列何者正確？", "o": ["依序可分為M期、G1期、G2期、S期，再回到M期", "可受到各種MAP kinase (mitogen-activated protein kinase)調控", "被細胞外之生長因子(growth factor)所抑制", "只要細胞存活，細胞週期就會不斷進行"], "a": 1, "e": "順序是 G1→S→G2→M，(A) 錯。生長因子是促進分裂，(C) 錯。細胞可以進入 G0 休息，(D) 錯。MAPK 會傳遞生長訊號，(B) 對。"}, {"q": "下列關於細胞週期(cell cycle)的敘述，何者錯誤？", "o": ["所有細胞的G1期長度都相同", "細胞週期的限制點(restriction point)位於G1期與S期中間", "S期的主要任務為DNA複製", "在M期內，細胞會進行有絲分裂(mitosis)以及細胞質分裂(cytokinesis)"], "a": 0, "e": "不同細胞的 G1 長短差很多，例如腸細胞很快，肝細胞很慢，所以 (A) 錯。"}]}, {"t": "單元2　DNA 複製", "qs": [{"q": "DNA複製(DNA replication)由起始點開始，下列有關真核細胞(eukaryotic cell)DNA型態與複製起始點數量何者正確？", "o": ["DNA為圓形，而且有多於一個以上的複製起始點(origin of replication)", "DNA為線形，而且有多於一個以上的複製起始點", "DNA為圓形，只有一個複製起始點", "DNA為線形，只有一個複製起始點"], "a": 1, "e": "人的 DNA 是線形，而且很長，需要很多起點同時開工；細菌 DNA 是環形又短，一個起點就夠。", "m": "真核線形多起點，細菌環形單起點。"}, {"q": "真核生物染色體有別於細菌，需要多個DNA複製起始點(multiple DNA replication origins)，下列何者是其最主要的理由？", "o": ["真核生物染色體通常無法進行雙向複製作用", "真核生物基因體如同細菌染色體一樣均屬於非環狀的構造", "真核生物DNA polymerase的processivity相較於細菌者慢", "若一條染色體只有單一個複製起始點會使染色體的複製速率變慢"], "a": 3, "e": "一條染色體很長，只靠一個起點複製會來不及，所以開很多工地同時做。"}, {"q": "下列關於DNA複製(DNA replication)所使用引子(primer)的敘述，何者為正確？", "o": ["DNA複製所使用的引子，是由引子酶(primase)所負責合成的", "DNA複製所使用的引子，3’端是RNA，而5’端是DNA", "DNA複製所使用引子的合成方向為3’→5’", "DNA複製所使用引子的合成不需要模板"], "a": 0, "e": "引子由引子酶(primase)製造，是一小段 RNA。\n(B) 引子是 RNA。(C) 所有合成都是 5’→3’。(D) 需要模板配對。"}, {"q": "引子(primer)是DNA複製時的必須材料，下列何者為引子的主要功能？", "o": ["確定DNA生合成的起點及方向，提供一個羥基(-OH)作為DNA延伸之用", "誘發DNA生合成的起點及方向，並決定生合成的終點", "可決定前導股(leading strand)，但無法決定遲緩股(lagging strand)的形成", "可幫助DNA雙螺旋的解旋工作，誘發DNA的生合成"], "a": 0, "e": "DNA 聚合酶不能憑空開始，需要一個 -OH 才能接下去。引子就是提供這個起點。"}, {"q": "細胞在分裂之前，細胞進行DNA複製(replication)的模式為？", "o": ["全保留", "半保留", "分散式", "1/4保留"], "a": 1, "e": "半保留：兩股分開，各當模板，新 DNA 都是一舊一新。"}, {"q": "下列有關DNA複製的敘述，何者錯誤？", "o": ["以A與T配對，G與C配對的方式進行複製", "複製過程中，兩股會打開形成單股結構", "以半保留複製(semi-conservative replication)方式進行複製", "複製完成，每股DNA均含有新、舊核酸分子"], "a": 3, "e": "一個雙股 DNA 有一條舊股和一條新股，但「每一股」本身不會新舊混合，所以 (D) 錯。"}, {"q": "關於人類DNA複製(replication)的敘述，下列何者正確？", "o": ["DNA聚合酶(DNA polymerase)負責加入核苷(nucleoside)", "DNA引子酶(DNA primase)負責啟動DNA引子(DNA primer)合成", "解螺旋酶(helicase)不需耗能即可鬆開(unwind) DNA雙股螺旋結構", "DNA接合酶(DNA ligase)負責密封(seal)單股DNA缺口(nick)"], "a": 3, "e": "連接酶像膠水，把單股缺口封起來，(D) 對。\n(A) 加入的是核苷酸，不是核苷。(B) 人類的引子是 RNA。(C) 解旋需要 ATP。"}, {"q": "關於分子生物學的中心法則，下列敘述何者正確？", "o": ["DNA複製採取半保留法", "RNA也可複製", "只有真核生物符合中心法則", "RNA和DNA都可做為生物細胞的遺傳物質"], "a": 0, "e": "中心法則：DNA→RNA→蛋白質。DNA 用半保留複製，原核真核都適用，所以 (A)。\n(C) 太狹隘。(D) 細胞都用 DNA。", "n": "(B) RNA 也可複製，在部分 RNA 病毒確實如此。講義解析採「RNA 透過 DNA 轉錄」的角度，所以這裡選 (A)。"}, {"q": "有關complementary DNA (cDNA)的敘述，下列何者正確？", "o": ["一股RNA與另一股與其互補的RNA組成的雙股結構", "一段RNA經反轉錄作用後形成的雙股DNA", "一段RNA經環化作用後形成的環狀雙股DNA", "一股RNA與另一股與其互補的DNA組成的雙股結構"], "a": 1, "e": "cDNA 由 RNA 反轉錄得到，最後是雙股 DNA。"}, {"q": "下列何種酵素可用RNA當模版合成互補DNA (cDNA)？", "o": ["RNA聚合酶", "反轉錄酶(reverse transcriptase)", "DNA聚合酶(polymerase)", "限制酶(restriction enzymes)"], "a": 1, "e": "RNA 當模板做 DNA，就是反轉錄酶。"}, {"q": "complementary DNA (cDNA)的製備須有何種酵素的參與？", "o": ["DNA polymerase & cyclic nucleotide phosphodiesterase", "reverse transcriptase & RNA polymerase I", "reverse transcriptase & DNA polymerase I", "RNA polymerase & cyclic nucleotide phosphodiesterase"], "a": 2, "e": "cDNA 要兩步：反轉錄酶做第一股，DNA 聚合酶 I 做第二股。"}, {"q": "下列有關DNA複製的敘述，何者錯誤？", "o": ["複製的方向為5’→3’", "領先股(leading strand)為不連續複製", "落後股(lagging strand)含有岡崎片段(Okazaki fragment)", "真核生物具有多個複製起點(initiation site)"], "a": 1, "e": "領先股順著方向連續做。落後股才一段一段（岡崎片段）。(B) 把兩者說反了。", "m": "領先連續，落後片段。"}, {"q": "下列關於DNA複製(DNA replication)的敘述，哪一項論述是錯誤的？", "o": ["有DNA指導的RNA聚合酶參加", "有DNA指導的DNA聚合酶參加", "為半保留複製(semiconservative replication)", "以四種dNTP為原料", "有RNA指導的DNA聚合酶參加"], "a": 4, "e": "細胞複製 DNA 會用到：做引子的 primase（DNA 指導的 RNA 聚合酶）、DNA 聚合酶、dNTP。反轉錄酶是病毒和端粒酶才用，一般複製不用。"}, {"q": "DNA複製過程中，下列何者是DNA接合酶的作用？", "o": ["利用ATP催化解開DNA雙股螺旋結構", "利用ATP使DNA維持雙股螺旋形式", "穩定單股DNA", "利用ATP催化補足磷酸雙酯鍵連結兩股DNA片段"], "a": 3, "e": "連接酶把兩段 DNA 接起來，形成磷酸雙酯鍵。\n(A) 是解旋酶，(C) 是 SSB。"}, {"q": "下列何種蛋白質分子不參與原核細胞DNA複製作用(replication)之進行？", "o": ["RNA引子酶(primase)", "RNA聚合酶II (RNA polymerase II)", "DNA聚合酶III (DNA polymerase III)", "解旋酶(helicase)"], "a": 1, "e": "RNA 聚合酶 II 是真核細胞才有，專做 mRNA。原核不用，所以 (B) 不參與。"}, {"q": "下列有關DNA複製(DNA replication)的敘述，何者錯誤？", "o": ["DNA複製以半保留(semiconservative)模式進行", "DNA複製過程中會產生引導股(leading strand)與落後股(lagging strand)", "DNA合成(DNA synthesis)由3’往5’端進行", "DNA複製後，原始模版(parental strand)與新合成模版(newly synthesized strand)兩股以反向平行(antiparallel)形成雙股結構"], "a": 2, "e": "不論哪種 DNA，新股都由 5’ 往 3’ 延長，(C) 錯。", "m": "永遠 5’→3’。"}, {"q": "DNA複製時lagging strand是由下列何者連結而成？", "o": ["Kawazaki fragment(川崎片段)", "Okinawa fragment(沖繩片段)", "Okazaki fragment(岡崎片段)", "Shine-Dalgarno fragment(夏因-達爾加諾片段)"], "a": 2, "e": "日本學者岡崎發現的片段。其他選項是故意取的相似名字。"}, {"q": "有關E. coli DNA之延遲股(lagging strand)複製的敘述，何者正確？", "o": ["由DNA聚合酶I負責複製", "以3'→5'方向進行複製", "為連續進行之複製反應", "先合成岡崎片段(Okazaki fragments)"], "a": 3, "e": "落後股要一段一段做，所以先有岡崎片段。主力酵素是 Pol III，方向仍是 5’→3’，不連續。"}, {"q": "DNA複製必須由起始點開始，下列有關真核細胞中的DNA型態與複製起始點數量何者正確？", "o": ["DNA為線形，只有一個複製起始點", "DNA為圓形，只有一個複製起始點", "DNA為圓形，而且有多於一個以上的複製起始點", "DNA為線形，而且有多於一個以上的複製起始點"], "a": 3, "e": "與第 1 題相同：真核線形多起點。"}, {"q": "真核細胞複製子(replicon)它們具有下列何者特徵？", "o": ["比原核生物複製子短得多，因為有末端序列的存在", "比原核生物複製子長得多，因為有較大的基因組", "通常是雙向複製且能融合", "全部立即啟動，以確保染色體在S期完成複製", "不是全部立即啟動，在任何給定的時間只有大約15%是有活性的"], "a": 4, "e": "真核的複製起點不是同時全開，而是分批啟動，這樣才能在 S 期依序完成。", "n": "講義未附答案。(C) 雙向複製且能融合也是正確事實，這題可能不只一個選項成立，請向老師確認。"}, {"q": "細菌DNA分子複製時，培養基中若含有N¹⁵的鹼基，則N¹⁵會被合成入DNA中。一科學家將細菌在N¹⁵的培養基中繁殖很多代後，再接種於含N¹⁴的新培養基中培養。下列有關細菌在新培養基中進行細胞分裂的敘述，何者正確？", "o": ["經過一次分裂後，1/4的細菌具有N¹⁵的DNA", "經過一次分裂後，半數的細菌具有N¹⁵的DNA", "經過二次分裂後，1/4的細菌具有N¹⁵的DNA", "經過二次分裂後，半數的細菌具有N¹⁵的DNA"], "a": 3, "e": "第一次分裂：每個 DNA 一舊（¹⁵N）一新（¹⁴N），全部含 ¹⁵N。\n第二次：4 個 DNA 中只有 2 個還帶舊股，所以一半。", "m": "舊股永遠只有 2 條。"}, {"q": "大腸桿菌在複製DNA時，下列那一種酵素負責合成延長新股DNA？", "o": ["DNA polymeraseⅢ", "DNA polymeraseⅠ", "DNA gyrase", "DNA ligase"], "a": 0, "e": "大腸桿菌主力是 Pol III。Pol I 補洞，gyrase 解超螺旋，ligase 接合。"}, {"q": "DNA連接酶在下列哪一個過程中是不需要的？", "o": ["DNA複製", "DNA修復", "DNA斷裂和修飾", "基因工程製備重組DNA"], "a": 2, "e": "複製要接岡崎片段，修復要接缺口，基因工程要接片段，都要連接酶。(C) 斷裂不需要接合。"}, {"q": "DNA複製過程中，下列何者不是DNA聚合酶I的特性？", "o": ["負責E.coli內DNA合成的主要酵素", "負責校正與修補的功能", "具有3’→5’外核酸酶活性", "具有5’→3’外核酸酶活性"], "a": 0, "e": "Pol I 是修補工，不是主力。主力是 Pol III。", "m": "III 主力合成，I 修補。"}, {"q": "DNA複製過程中，下列何者不是DNA聚合酶III的特性？", "o": ["負責E. coli內DNA合成的主要酵素", "只負責校正與修補的功能", "具有3’→5’外核酸酶活性", "具有5’→3’外核酸酶活性"], "a": 1, "e": "Pol III 主要負責合成，校正只是附帶功能。(B) 說「只負責」校正，所以不是它的特性。", "n": "(D) 也不是 Pol Ⅲ 的特性（第 42 題就是考這點）。這題有兩個選項不成立，因本題寫「只負責」，選 (B)，建議向老師確認。"}, {"q": "哪一個酵素沒有參與在DNA複製的過程當中？", "o": ["DNA聚合酶(DNA polymerase)", "核酸水解酶(ribonuclease)", "端粒酶(telomerase)", "DNA解旋酶(helicase)"], "a": 1, "e": "聚合酶、端粒酶、解旋酶都是複製常見角色。核酸水解酶是分解 RNA 的，不算主要角色。", "n": "真核細胞中 RNase H 其實會協助移除引子，這題的選項不夠精確，請以老師答案為準。"}, {"q": "下列有關DNA複製(DNA replication)的敘述，何者錯誤？", "o": ["DNA複製以半保留(semiconservative)模式進行", "DNA複製過程中會產生引導股(leading strand)與落後股(lagging strand)", "DNA合成(DNA synthesis)由3’往5’端進行", "DNA複製後，原始模版(parental strand)與新合成模版(newly synthesized strand)兩股以反向平行(antiparallel)形成雙股結構"], "a": 2, "e": "新股一律 5’→3’，(C) 錯。"}, {"q": "在人類細胞中，DNA複製(DNA replication)時是以何種物質為引子(primer)？", "o": ["DNA", "RNA", "蛋白質", "不需引子"], "a": 1, "e": "人類複製的引子是 RNA。PCR 才用人工合成的 DNA 引子。"}, {"q": "在DNA複製時，下列所有因素對DNA鏈解旋和解鏈都是必需的，但下列何者除外？", "o": ["負超螺旋傾向解旋", "通過解旋酶解開不穩定的鹼基對", "需要拓撲異構酶(topoisomerase)的作用", "SSB (single-stranded DNA-binding)蛋白酶的活性", "需要以ATP的形式供應能量"], "a": 3, "e": "SSB 只是貼在單股上保護，沒有酵素活性，所以「蛋白酶的活性」不是必需。"}, {"q": "大腸桿菌(E. coli)複製叉(replication fork)上之單股DNA會與下列何種蛋白質結合，以避免重新形成氫鍵回復至雙股狀態？", "o": ["解旋酶(helicase)", "拓樸異構酶(topoisomerase)", "引子酶(primase)", "SSB (single-stranded DNA binding protein)"], "a": 3, "e": "SSB 全名就是單股 DNA 結合蛋白，負責穩定單股。"}, {"q": "DNA helicase (DNA解旋酶)的功能為何？", "o": ["合成RNA primer", "接合Okazaki fragment(岡崎片段)", "加長DNA序列", "於複製叉(replication fork)處催化DNA雙股鬆開", "合成DNA ligase(DNA連接酶)"], "a": 3, "e": "Helicase 名字就是解開螺旋，在複製叉處打開雙股。"}, {"q": "DNA複製時，複製叉口(replication fork)前面會產生超螺旋(supercoiled)結構，細胞中負責解開此結構的酵素是：", "o": ["Primase", "DNA polymerase", "DNA helicase", "Topoisomerase"], "a": 3, "e": "解開雙股時前方會絞緊，topoisomerase 負責解開這個扭力。", "m": "Helicase 開拉鍊，Topo 鬆扭力。"}, {"q": "下列何種DNA的缺口可藉由DNA連接酶(ligase)所接合？", "o": ["5’-OH+3’-OH", "5’-O-P+3’-OH", "5’-OH+3’-O-P", "5’-O-P+3’-O-P"], "a": 1, "e": "連接酶需要一邊有 5’ 磷酸、一邊有 3’-OH，才能接成磷酸雙酯鍵。"}, {"q": "下列何者是DNA複製過程中解旋酶的作用？", "o": ["利用ATP使DNA維持雙股螺旋形式", "穩定單股DNA", "辨識及結合於複製起始點，利用ATP催化解開DNA雙股螺旋結構", "負責DNA的修補"], "a": 2, "e": "解旋酶在起點利用 ATP 打開雙股。"}, {"q": "有關解螺旋酶(helicase)的敘述，下列何者為正確？", "o": ["穩定單股DNA", "可利用貯存於磷酸二酯鍵的能量溶解DNA", "能使超螺旋(supercoils)轉變成鬆弛圓圈(relaxed circles)", "可利用貯存於ATP的能量打開雙股DNA"], "a": 3, "e": "Helicase 消耗 ATP 打開雙股。"}, {"q": "下列哪一種酵素基因突變會導致岡崎片段(Okazaki fragment)在細胞中累積？", "o": ["DNA聚合酶", "RNA聚合酶", "DNA連接酶", "RNA連接酶"], "a": 2, "e": "岡崎片段靠連接酶接起來；連接酶壞掉，片段就累積。"}, {"q": "Okazaki fragment (Okazaki片段)是出現在細胞進行那種現象時？", "o": ["RNA複製", "DNA水解", "RNA水解", "DNA複製"], "a": 3, "e": "岡崎片段是 DNA 複製才有的。"}, {"q": "下列何種酵素可以在DNA複製時將其引子(primer)RNA分解，並由岡崎片段(Okazaki fragment)的3’端加入核苷酸配對？", "o": ["DNA解旋酶(helicase)", "DNA聚合酶 III (DNA polymerase III)", "RNA引子酶(primase)", "DNA聚合酶 I (DNA polymerase I)"], "a": 3, "e": "Pol I 同時會切 RNA 引子，也會補上 DNA。"}, {"q": "克雷諾夫片段(Klenow fragment)是指：", "o": ["去掉5’→3’外切核酸酶活性之DNA複製I", "去掉3’→5’外切核酸酶活性之DNA複製I", "去掉5’→3’外切核酸酶活性之DNA複製Ⅲ", "去掉3’→5’外切核酸酶活性之DNA複製Ⅲ"], "a": 0, "e": "Klenow 是 Pol I 拿掉切引子功能（5’→3’ 外切）後的片段。"}, {"q": "Klenow fragment(克萊諾片段)是大腸桿菌(E. coli)DNA聚合酶I型(DNA polymerase I)的片段，其主要具有何種酵素活性？", "o": ["聚合酶與5’核酸外切酶(polymerase 和 5’-exonuclease)活性", "聚合酶與3’核酸外切酶(polymerase 和3’-exonuclease)活性", "5’與3’核酸外切酶(5’和3’-exonuclease)活性", "聚合酶以及5’與3’核酸外切酶(polymerase，5’和3’-exonuclease)活性"], "a": 1, "e": "Klenow 保留兩種能力：合成 DNA 和校正錯誤（3’→5’ 外切）。"}, {"q": "DNA複製過程中，下列何者不是DNA聚合酶I的特性？", "o": ["負責E. coli內DNA合成的主要酵素", "負責校正與修補的功能", "具有3’→5’外核酸酶活性", "具有5’→3’外核酸酶活性"], "a": 0, "e": "主力合成酵素是 Pol III，不是 Pol I。"}, {"q": "DNA複製過程中，下列何者不是DNA聚合酶III的特性？", "o": ["負責大腸桿菌(E. coli)內DNA合成的主要酵素", "負責校正與修補的功能", "具有3’→5’外核酸酶活性", "具有5’→3’外核酸酶活性"], "a": 3, "e": "Pol III 能校正（3’→5’），但沒有切引子的 5’→3’ 活性。"}, {"q": "缺乏端粒酶(telomerase)的真核細胞，下列何者敘述正確？", "o": ["無法修補thymine dimmers", "可能導致癌化", "會造成染色體長度變短", "產生岡崎片段(Okazaki fragments)"], "a": 2, "e": "端粒酶負責補回末端。缺乏時染色體每分裂一次就變短。"}, {"q": "大約在1,000個出生男嬰中，就有一個染色體核型(karyotype)是47, XYY，男生多了一條Y染色體，其最有可能發生原因為何？", "o": ["在細胞減數分裂(meiosis)時，體染色體發生不分離現象(non-disjunction)", "高齡產婦", "在有絲分裂(mitosis)時，Y染色體有不分離現象發生", "Y染色體不分離現象發生在減數分裂期II (meiosis II)"], "a": 3, "e": "多一條 Y 只能來自爸爸，且形成 YY 精子，代表減數分裂 II 時兩條姊妹染色分體沒有分開。"}, {"q": "人類非轉譯DNA，為重複DNA (repetitive DNA)，具有保護染色體作用，與細胞老化有關者，屬於下列何者構造？", "o": ["操縱子(operator)", "強化子(enhancer)", "端粒(telomere)", "啟動子(promoter)"], "a": 2, "e": "端粒在染色體末端，像鞋帶頭保護鞋帶，與老化有關。"}, {"q": "缺乏telomerase的真核細胞，將會產生何種現象？", "o": ["轉變成癌細胞的可能性大增", "無法從週邊獲得DNA", "無法確認子細胞的DNA序列是否正確", "染色體經過複製後逐漸縮減"], "a": 3, "e": "缺端粒酶：染色體越分裂越短。"}, {"q": "下列何種酵素活性增加可造成癌細胞無法進行正常細胞的老化現象？", "o": ["去氧核糖核酸聚合酶-α型(DNA polymerase alpha)", "去氧核糖核酸聚合酶-δ型(DNA polymerase delta)", "去氧核糖核酸接合酶(DNA ligase)", "端粒酶(telomerase)"], "a": 3, "e": "癌細胞打開端粒酶，端粒不再變短，才能無限分裂。"}, {"q": "缺乏telomerase的真核細胞，將會產生何種現象？", "o": ["無法從週邊獲得DNA", "無法確認子細胞的DNA序列是否正確", "染色體經過複製後逐漸縮減", "轉變成癌細胞的可能性大增"], "a": 2, "e": "與第 46 題相同：染色體縮短。"}, {"q": "有關Telomerase之敘述何者不正確？", "o": ["是一種反轉錄酶(reverse transcriptase)", "一種5'→3' exonuclease", "會在真核細胞染色體DNA之兩端點加上一連串特殊的重複序列", "此酶本身有一條RNA模版，用以複製DNA尾端特殊的重複序列"], "a": 1, "e": "端粒酶帶自己的 RNA 模板，所以是反轉錄酶，不是外切酶，(B) 錯。"}, {"q": "有關telomeres的敘述，下列何者錯誤？", "o": ["位於真核細胞線性染色體的末端結構", "含有多個短序列的重覆", "隨著細胞的複製，其序列會逐漸增長", "藉由telomerase將telomere加至染色體"], "a": 2, "e": "細胞每分裂一次，端粒越短，(C) 說增長是錯的。"}, {"q": "為了讓真核生物的染色體，在細胞不斷分裂後，還能保持染色體的完整性的特殊構造，稱為：", "o": ["centromere", "centrosome", "telomere", "endosome"], "a": 2, "e": "端粒維持末端完整。著絲粒負責分裂時牽引。"}, {"q": "人類非轉譯DNA，為重複DNA (repetitive DNA)，具有保護染色體作用，與細胞老化有關者，屬於下列何者構造？", "o": ["操縱子(operator)", "端粒(telomere)", "強化子(enhancer)", "啟動子(promoter)"], "a": 1, "e": "與第 45 題相同：端粒。"}]}];
const KEY='molbio-u12-v1';
let state={};let cur=0;let only=false;let armed=false;
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=id=>document.getElementById(id);
const letters='ABCDE';
const pick=(u,i)=>state[u+'-'+i];
function counts(u){let done=0,ok=0;DATA[u].qs.forEach((q,i)=>{const p=pick(u,i);if(p!==undefined){done++;if(p===q.a)ok++}});return{done,ok,n:DATA[u].qs.length}}
function renderUnits(){
  $('units').innerHTML='';
  DATA.forEach((d,u)=>{const c=counts(u);const b=document.createElement('button');b.className='unit';b.id='unit'+u;
    b.setAttribute('aria-pressed',u===cur);b.setAttribute('aria-label',d.t);
    b.innerHTML='<b>'+(u+1)+'</b><span>'+c.done+'/'+c.n+'</span>';
    b.onclick=()=>{cur=u;only=false;armed=false;render();window.scrollTo({top:0})};$('units').appendChild(b)});
}
function renderHead(){
  const d=DATA[cur],c=counts(cur);$('title').textContent=d.t;
  $('score').textContent='答對 '+c.ok+'／已答 '+c.done+'／共 '+c.n;
  $('lane').innerHTML='';
  d.qs.forEach((q,i)=>{const p=pick(cur,i);const a=document.createElement('a');a.href='#';a.title='第 '+(i+1)+' 題';a.setAttribute('aria-label','第 '+(i+1)+' 題');
    if(p!==undefined)a.className=p===q.a?'ok':'no';
    a.onclick=e=>{e.preventDefault();if(only){only=false;render()}const t=$('q'+i);if(t)t.scrollIntoView({behavior:'smooth'})};$('lane').appendChild(a)});
  $('onlyWrong').setAttribute('aria-pressed',only);
  $('reset').textContent=armed?'確定清除本單元作答':'重做本單元';$('reset').classList.toggle('confirm',armed);
  $('next').textContent=cur<DATA.length-1?'下一單元':'回到單元 1';
}
function answerHtml(q,p){
  const good=p===q.a;
  
  return '<div class="ans '+(good?'good':'bad')+'"><p class="verdict">'+(good?'答對了':'答錯了')+'，答案是 ('+letters[q.a]+')</p><p>'+q.e.replace(/\n/g,'<br>')+'</p>'+(q.m?'<p class="tip">記法：'+q.m+'</p>':'')+(q.n?'<p class="note">講義提醒：'+q.n+'</p>':'')+'</div>';
}
function tbl(r){return '<div class="tw"><table>'+r.map((x,i)=>'<tr>'+x.split('|').slice(1,-1).map(c=>(i?'<td>':'<th>')+esc(c.trim())+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function renderItem(u,i){
  const q=DATA[u].qs[i],p=pick(u,i),li=document.createElement('li');li.className='item';li.id='q'+i;
  let h='<div class="qhead"><span class="num">第 '+(i+1)+' 題</span>'+'</div><p class="qtext">'+esc(q.q)+'</p>'+(q.tb?tbl(q.tb):'')+'<div class="opts">';
  q.o.forEach((o,k)=>{let c='opt';if(p!==undefined){if(k===q.a)c+=' right';else if(k===p)c+=' wrong'}
    h+='<button class="'+c+'" id="o'+u+'-'+i+'-'+k+'" data-k="'+k+'"'+(p!==undefined?' disabled':'')+'><i>('+letters[k]+')</i><span>'+esc(o)+'</span></button>'});
  h+='</div>'+(p!==undefined?answerHtml(q,p):'');li.innerHTML=h;
  if(p===undefined)li.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state[u+'-'+i]=+b.dataset.k;save();li.replaceWith(renderItem(u,i));renderUnits();renderHead()});
  return li;
}
function renderList(){
  const L=$('list');L.innerHTML='';let n=0;
  DATA[cur].qs.forEach((q,i)=>{const p=pick(cur,i);if(only&&(p===undefined||p===q.a))return;L.appendChild(renderItem(cur,i));n++});
  if(!n){const e=document.createElement('li');e.className='empty';e.textContent='本單元目前沒有答錯的題目。';L.appendChild(e)}
}
function render(){renderUnits();renderHead();renderList()}
$('onlyWrong').onclick=()=>{only=!only;armed=false;render()};
$('reset').onclick=()=>{if(!armed){armed=true;renderHead();return}Object.keys(state).forEach(k=>{if(k.startsWith(cur+'-'))delete state[k]});save();armed=false;only=false;render()};
$('next').onclick=()=>{cur=(cur+1)%DATA.length;only=false;armed=false;render();window.scrollTo({top:0})};
render();
</script>
