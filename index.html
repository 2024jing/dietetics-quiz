const list=()=>D.filter(x=>sel.value=='all'||x.s==sel.value);
function score(){const k=list().map(x=>x.pdf);let a=0,c=0,t=0;if(mode!=2){t+=k.length;k.forEach(i=>{if(i in A){a++;c+=A[i]}})}if(mode!=1){t+=k.length;k.forEach(i=>{if(i in B){a++;c+=B[i]}})}sc.textContent=`已答 ${a}/${t}｜答對 ${c}`}
function mc(x,d){const lb=document.createElement('p');lb.className='lb';lb.textContent='選擇';const p=document.createElement('p');p.className='qt';p.textContent=x.q;d.append(lb,p);
const fb=document.createElement('p');fb.className='fb';fb.hidden=true;const ord=[0,1,2,3].sort(()=>Math.random()-.5),R=ord.indexOf(0);
const bs=ord.map((oi,i)=>{const b=document.createElement('button');b.className='o';b.id=`m${x.pdf}-${i}`;b.textContent=L[i]+'. '+x.o[oi];b.onclick=()=>{bs.forEach(k=>k.disabled=true);bs[R].classList.add('y');if(i!=R)b.classList.add('x');A[x.pdf]=+(i==R);fb.hidden=false;fb.innerHTML=`<b class="${i==R?'g':'w2'}">${i==R?'答對':'答錯'}</b>　答案 ${L[R]}`;score()};d.append(b);return b});d.append(fb)}
function fl(x,d){const lb=document.createElement('p');lb.className='lb';lb.textContent='填空';const p=document.createElement('p');p.className='qt';p.textContent=x.f;const r=document.createElement('div');r.className='row';const t=document.createElement('input');t.id='f'+x.pdf;t.setAttribute('aria-label','填空答案');const b=document.createElement('button');b.textContent='看答案';const fb=document.createElement('p');fb.className='fb';fb.hidden=true;
const go=()=>{const ok=x.a.some(a=>norm(a)==norm(t.value));B[x.pdf]=+ok;fb.hidden=false;fb.innerHTML=`<b class="${ok?'g':'w2'}">${ok?'答對':'再看一次'}</b>　答案：${x.a[0]}`;score()};b.onclick=go;t.onkeydown=e=>{if(e.key=='Enter')go()};r.append(t,b);d.append(lb,p,r,fb)}
function show(){m.innerHTML='';let last='';list().forEach(x=>{if(x.s!=last){last=x.s;const h=document.createElement('h2');h.textContent=x.ch+'｜'+x.s;m.append(h)}const d=document.createElement('div');d.className='q';const g=document.createElement('p');g.className='pg';g.innerHTML='<b></b>';g.firstChild.textContent=`PDF 第 ${x.pdf} 頁`;g.append(`｜${x.t}｜投影片 ${x.pg}`);d.append(g);if(mode!=2)mc(x,d);if(mode!=1)fl(x,d);m.append(d)});score()}
[t0,t1,t2].forEach((b,i)=>b.onclick=()=>{mode=i;[t0,t1,t2].forEach((k,j)=>k.setAttribute('aria-pressed',j==i));show()});
sel.onchange=()=>{show();scrollTo(0,0)};r.onclick=()=>{list().forEach(x=>{delete A[x.pdf];delete B[x.pdf]});show();scrollTo(0,0)};show();
</script>
</body></html>
